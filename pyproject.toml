[project]
name = "crisis-relay"
version = "0.1.0"
description = "CrisisRelay Gemini intelligence service"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116.0",
  "google-genai>=1.0.0",
  "pydantic>=2.0.0",
  "pymongo>=4.7",
  "python-dotenv>=1.0",
  "solana>=0.36",
  "solders>=0.26",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<0.29",
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

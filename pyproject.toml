[project]
name = "crisis-relay"
version = "0.1.0"
description = "CrisisRelay Gemini intelligence service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "google-genai>=1.0.0",
  "pydantic>=2.0.0",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
